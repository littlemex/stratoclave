name: audit

# Supply-chain audit (A-04-ci, 2026-06 hardening sweep).
#
# Runs known-vulnerability scanners across every language ecosystem in
# the repo so a bumped dependency that ships a CVE breaks the merge
# rather than landing silently.
#
# Why these tools, with these flags:
#   - pip-audit  : reads requirements*.txt, reports against PyPI advisories.
#                  --strict makes any finding fail; ignore-vulns can be added
#                  case-by-case with a comment justifying the deferral.
#   - cargo-audit: reads Cargo.lock, reports against the RustSec advisory DB.
#                  --deny warnings turns advisories into a non-zero exit.
#   - npm audit  : reads package-lock.json. Its default exits non-zero on any
#                  finding at moderate or higher; both jobs below deliberately
#                  raise the bar to `--audit-level=high`, so a moderate finding
#                  is reported and does NOT block. Run on both `iac/` and
#                  `frontend/` lockfiles. (This said the strict default was kept,
#                  which sent a reader looking for a moderate gate that does not
#                  exist — and, once, to bundle two unnecessary major bumps.)
#
# Triage policy: a CVE finding blocks merge until either (a) bumped to a
# fixed version, or (b) explicitly deferred via the per-tool ignore
# mechanism with an inline reason and a tracking issue.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Re-run weekly so a new CVE against an already-pinned dep surfaces
    # without requiring a code change.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: backend / pip-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install --no-cache-dir pip-audit
      - name: Audit runtime dependencies
        run: pip-audit --strict -r requirements.txt
      - name: Audit dev dependencies
        run: pip-audit --strict -r requirements-dev.txt

  cargo-audit:
    name: cli / cargo-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: |
          rustup set profile minimal
          rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Run cargo audit
        # See cli/audit.toml: any --ignore here needs an inline justification
        # there, and there is none today.
        run: cargo audit --deny warnings

  npm-audit-iac:
    name: iac / npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iac
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: iac/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit
        # `npm audit` exits non-zero on vulnerabilities at "moderate" or
        # higher; --audit-level=high keeps low-severity dev-only findings
        # out of the merge gate while still failing on anything serious.
        run: npm audit --audit-level=high

  npm-audit-frontend:
    name: frontend / npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit
        # Fails on any high or critical advisory not on the allowlist below. npm
        # has no per-advisory --ignore, so the JSON report is filtered instead.
        #
        #   GHSA-vfj7-8cjw-p6xm  braces stack-exhaustion DoS (high). No fixed
        #   version exists: the latest braces (3.0.3) is affected. It is reached
        #   only through tailwindcss 3 (chokidar / micromatch / fast-glob) while
        #   it scans this repository's own content globs at build time, never on
        #   input from a user. Delete it once braces publishes a fix, or when the
        #   frontend moves to tailwindcss 4, which no longer depends on it.
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          ALLOW = {"GHSA-vfj7-8cjw-p6xm"}
          out = subprocess.run(
              ["npm", "audit", "--audit-level=high", "--json"],
              capture_output=True, text=True).stdout
          report = json.loads(out)
          blocking = []
          for name, v in report.get("vulnerabilities", {}).items():
              if v.get("severity") not in ("high", "critical"):
                  continue
              ids = {via.get("url", "").rsplit("/", 1)[-1]
                     for via in v.get("via", []) if isinstance(via, dict)}
              if ids - ALLOW:
                  blocking.append((name, v.get("severity"), sorted(ids)))
          if blocking:
              print("Blocking high/critical advisories (not on allowlist):")
              for n, sev, ids in blocking:
                  print(f"  {n} [{sev}] {ids}")
              sys.exit(1)
          print(f"npm audit: only allowlisted advisories present ({sorted(ALLOW)}); OK.")
          PY
