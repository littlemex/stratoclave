name: test

# Runs unit and integration tests for Backend (pytest), CLI (cargo test),
# and Frontend (vitest) on every pull request and push to main.
#
# Coverage:
#   - Backend (~3,000 tests, two lanes): credit reservation atomicity, model allowlist,
#     well-known discovery contract, JWT verification, RBAC helpers,
#     API key scope narrowing, tenant isolation, SSO gate, bootstrap
#     seed (including the scan_admins reserved-keyword regression).
#   - CLI (44 tests): config.toml schema regression, mvp token
#     persistence (0600 permissions), setup URL validation, wiremock-
#     driven `setup` integration against a stubbed backend.
#   - Frontend (31 tests): RBAC helpers, token storage, ProtectedRoute
#     integration, AuthContext bootstrap (3 paths), MeUsage rendering.
#
#   - Local mode (this file's `local` job): the scripts behind `make up`,
#     the API-key auth path against DynamoDB Local, the model registry, the
#     unknown-model guidance, plus `make prove` and `make demo-offline`. No AWS
#     credentials and no paid Bedrock call — the point is that the credential-free
#     paths cannot rot unnoticed.
#
# Playwright smoke runs separately in .github/workflows/e2e-nightly.yml.
# The compose build itself is exercised nightly, not here (see that file).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The fast lane, plus one job per heavy file, all at the same time. Measured on
  # this repository's own CI rather than a developer machine, because the two
  # differ by more than a factor of two: one serial job was 12m32s, the fast lane
  # alone is 2m31s, and the heavy files packed into a single job were 7m40s — so
  # the whole pull request waited on that one job.
  #
  # Splitting per file makes the wall clock the SLOWEST FILE instead of their sum.
  # It cannot go below the longest single test: three of these files hold exactly
  # one test each, the longest of them ~86s locally, and no number of workers
  # divides one test. Going under that floor means lowering the example counts
  # those tests set deliberately, which is a coverage decision and not this
  # change's to make.
  #
  # Neither lane deselects anything: every test runs on every commit, and `heavy`
  # marks WHERE a test runs, not whether.
  backend:
    name: backend / pytest (fast lane)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install runtime + dev dependencies
        # requirements-dev.txt includes pytest, moto, joserfc, ruff etc.
        # The production Docker image installs requirements.txt only.
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        # Process-level parallelism, not threads: conftest fixes every table name, so
        # workers sharing an interpreter would collide on them. moto keeps its state
        # per process, so a worker per process each gets its own.
        run: pytest -q -m "not heavy" -n auto tests/

  # The marker stays the single source of truth for what is heavy; this job only
  # turns it into a list of files. Nothing is installed here, so it costs a
  # checkout and a grep.
  heavy-files:
    name: backend / heavy lane file list
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.find.outputs.files }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        working-directory: backend
        # An empty list would give `fromJSON` an empty matrix, and an empty matrix
        # SKIPS its job silently — the heavy tests would stop running and the run
        # would still be green. So an empty result fails here instead.
        run: |
          set -euo pipefail
          files=$(grep -rl '^pytestmark = pytest.mark.heavy' tests/ | sort)
          if [ -z "$files" ]; then
            echo "no file carries a module-level heavy marker; refusing to produce" \
                 "an empty matrix, which would skip the heavy tests and stay green" >&2
            exit 1
          fi
          echo "$files"
          json=$(printf '%s\n' "$files" | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "files=$json" >> "$GITHUB_OUTPUT"

  backend-heavy:
    name: backend / pytest (${{ matrix.file }})
    needs: heavy-files
    runs-on: ubuntu-latest
    strategy:
      # Every heavy file reports its own result. One slow file failing must not
      # cancel the others, or a rerun tells you less than the first run did.
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.heavy-files.outputs.files) }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install runtime + dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        # `-m heavy` as well as the path: the path bounds collection to one file,
        # and the marker keeps a file that ever holds a mix of heavy and ordinary
        # tests from running its ordinary ones twice, once here and once in the
        # fast lane.
        run: pytest -q -m heavy -n auto "${{ matrix.file }}"

  local:
    name: local / offline paths + local-mode wiring
    runs-on: ubuntu-latest
    # DynamoDB Local, same pinned tag as docker-compose.yml. Nothing here talks
    # to AWS. The credentials below are AWS's own documentation example pair.
    # They have to be alphanumeric: DynamoDB Local names its database file after
    # the access key id and rejects anything it cannot use as one, answering
    # `UnrecognizedClientException` — which reads as if the request had reached
    # AWS. Every request made against the gateway stops before Bedrock is
    # invoked, so no real credential is needed.
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:2.5.2
        ports:
          - 8000:8000
    env:
      AWS_ENDPOINT_URL_DYNAMODB: http://127.0.0.1:8000
      AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
      AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      AWS_REGION: us-east-1
      ENVIRONMENT: ci
      STRATOCLAVE_CODEX_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install runtime + dev dependencies
        run: pip install -r backend/requirements-dev.txt

      # --- paths that need neither AWS nor a container -------------------
      - name: make verify-formal (Z3 invariants + the differential oracle)
        # `prove` replays the SMT proofs; `verify-rating` drives the real pricing
        # functions against an independently written reference, so "the encoding
        # matches the code" is sampled rather than assumed. Neither needs AWS.
        run: make verify-formal
      - name: make demo-offline (offline rating + savings fold)
        run: make demo-offline

      # --- the local-mode scripts, for real, against DynamoDB Local -----
      - name: Wait for DynamoDB Local
        # `services:` waits for the container to start, not for the process
        # inside it to listen. Probing over IPv4 explicitly: `localhost` can
        # resolve to ::1 first on the runner, which DynamoDB Local is not bound
        # to, and the resulting failure looks nothing like a DNS problem.
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null "$AWS_ENDPOINT_URL_DYNAMODB"; then
              echo "DynamoDB Local answering after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "DynamoDB Local never answered at $AWS_ENDPOINT_URL_DYNAMODB" >&2
          exit 1

      - name: Create the local tables
        run: |
          echo "endpoint: $AWS_ENDPOINT_URL_DYNAMODB"
          python scripts/local/create_tables.py
      - name: Seed the local user and API key
        run: python scripts/local/seed_local_user.py

      - name: Boot the gateway
        working-directory: backend
        run: |
          # nohup + disown so the process survives this step's shell exiting.
          PYTHONPATH=. nohup python -m uvicorn main:app --host 127.0.0.1 --port 8080 \
            > /tmp/gateway.log 2>&1 &
          disown
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/health; then
              echo "gateway up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "gateway did not become healthy" >&2
          tail -50 /tmp/gateway.log >&2
          exit 1

      - name: The seeded key authenticates and the registry answers
        # Exercises the whole credential-free auth path: key hash -> api-keys
        # table -> Users row -> org / roles / scopes, then the model registry.
        run: |
          KEY=$(cat data/local/api_key)
          code=$(curl -s -o /tmp/models.json -w '%{http_code}' \
            -H "Authorization: Bearer $KEY" http://127.0.0.1:8080/v1/models)
          test "$code" = "200" || { echo "expected 200, got $code" >&2; cat /tmp/models.json >&2; exit 1; }
          python - <<'PY'
          import json, sys
          data = json.load(open("/tmp/models.json")).get("data") or []
          if not data:
              sys.exit("the model registry came back empty")
          print(f"{len(data)} models listed")
          PY

      - name: An unrecognised model name is answered with guidance, not an internal path
        # Also a guard on the request path itself: this 400 is raised during model
        # resolution, before Bedrock would be called, so it needs no credentials.
        run: |
          KEY=$(cat data/local/api_key)
          code=$(curl -s -o /tmp/badmodel.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' \
            -d '{"model":"us.anthropic.claude-haiku-4-5","max_tokens":4,
                 "messages":[{"role":"user","content":"x"}]}' \
            http://127.0.0.1:8080/v1/messages)
          test "$code" = "400" || { echo "expected 400, got $code" >&2; cat /tmp/badmodel.json >&2; exit 1; }
          grep -q "GET /v1/models" /tmp/badmodel.json \
            || { echo "the error does not point the caller at the model list" >&2; cat /tmp/badmodel.json >&2; exit 1; }
          grep -q "claude-haiku-4-5" /tmp/badmodel.json \
            || { echo "the error does not suggest the alias it contains" >&2; cat /tmp/badmodel.json >&2; exit 1; }
          if grep -q "backend/mvp" /tmp/badmodel.json; then
            echo "the error leaks an internal source path" >&2; cat /tmp/badmodel.json >&2; exit 1
          fi

      - name: Gateway log on failure
        if: failure()
        run: tail -100 /tmp/gateway.log || true

  cli:
    name: cli / cargo test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        run: |
          rustup set profile minimal
          rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: Run cargo test (unit + integration)
        run: cargo test -- --test-threads=1

  frontend:
    name: frontend / vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run vitest
        run: npm test

  iac:
    # Sweep-4 (2026-04-30): IaC regressions on the ECS task role Scan
    # allowlist (and other CDK-level security controls) used to be
    # invisible to PR CI because `iac/` had no test job here. A server-
    # squash therefore could quietly re-introduce `api-keys` or
    # `permissions` into the dynamodb:Scan statement with zero CI
    # signal — exactly what happened between sweep-1 and sweep-3.
    # This job wires the jest suite under iac/test/ into PR-level
    # CI so any future regression fails the merge.
    name: iac / jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iac
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: iac/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run jest (CDK assertions)
        run: npm test

  secrets-patterns:
    # Sweep-4: guarantees the `scripts/check-no-hardcoded-secrets.sh`
    # pattern registry retains every required label. Complements the
    # `secrets-scan` workflow which runs the scanner itself — here we
    # lock that the scanner's rules haven't been silently weakened.
    name: scripts / secrets-patterns registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assert required pattern labels are present
        run: bash scripts/test-secrets-patterns.sh
