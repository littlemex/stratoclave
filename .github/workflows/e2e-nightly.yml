name: e2e-nightly

# Playwright smoke that runs on a schedule and on manual dispatch.
#
# Kept separate from the normal `test` workflow because:
#   - It needs Chromium downloads (~120MB) and can take minutes, which
#     is too heavy for every PR.
#   - It depends on stable UI text and screenshots that sometimes drift
#     with design changes, so flake risk is higher.
#
# The initial version only runs the `smoke.spec.ts` baseline to confirm
# that the Vite dev server boots and the login screen renders. Future
# iterations will add admin flows, MSW-backed backend stubs, and visual
# regression against docs/screenshots/images/.
#
# The `compose` job below covers the other slow thing: the local-mode
# container path from docker-compose.yml. The fast wiring checks for local
# mode (scripts, auth, registry, error guidance) run on every PR in
# .github/workflows/test.yml; what only this file can afford is actually
# building the backend image and starting the compose stack.

on:
  schedule:
    - cron: "23 17 * * *"  # 17:23 UTC nightly
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "frontend/e2e/**"
      - "docker-compose.yml"
      - "Makefile"
      - "scripts/local/**"
      - "backend/Dockerfile"
      - ".github/workflows/e2e-nightly.yml"

permissions:
  contents: read

concurrency:
  group: e2e-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: playwright / smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Seed runtime config.json for the dev server
        # The Vite dev server fetches `/config.json` at bootstrap. The real
        # file is generated from SSM in production deploys; for the smoke
        # we use the committed dev example so the app can render the
        # sign-in page without touching a real Cognito backend.
        run: cp public/config.json.dev.example public/config.json
      - name: Install Playwright browsers (chromium only)
        run: npx playwright install --with-deps chromium
      - name: Run Playwright smoke
        run: npx playwright test --project=chromium

  compose:
    name: compose / local-mode container path
    runs-on: ubuntu-latest
    # Builds the backend image and brings the local stack up for real. No AWS
    # credentials are supplied, so every check below stops before Bedrock is
    # invoked; `make demo` cannot run here and is deliberately not attempted.
    env:
      AWS_REGION: us-east-1
      AWS_PROFILE: ci-placeholder
    steps:
      - uses: actions/checkout@v7

      - name: The compose file is valid and its images are pinned
        run: |
          docker compose config >/tmp/compose-resolved.yml
          # A floating tag would silently change what the local path runs.
          if grep -E '^\s+image: .*:latest\s*$' /tmp/compose-resolved.yml; then
            echo "an image is pinned to :latest" >&2; exit 1
          fi

      - name: Provide a placeholder ~/.aws so the read-only mount resolves
        # compose mounts ${HOME}/.aws read-only for Bedrock credentials. There
        # are none here on purpose; the directory only has to exist.
        run: |
          mkdir -p "$HOME/.aws"
          printf '[profile ci-placeholder]\nregion = us-east-1\n' > "$HOME/.aws/config"

      - name: Bring the stack up
        run: |
          docker compose up -d --build
          for i in $(seq 1 120); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/health; then
              echo "gateway healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "gateway never became healthy" >&2
          docker compose logs --no-color --tail=120 >&2
          exit 1

      - name: Create tables and seed, through the same scripts the Makefile uses
        env:
          AWS_ENDPOINT_URL_DYNAMODB: http://localhost:8000
          AWS_ACCESS_KEY_ID: ci-local-placeholder
          AWS_SECRET_ACCESS_KEY: ci-local-placeholder
        run: |
          python -m pip install --quiet boto3
          python scripts/local/create_tables.py
          python scripts/local/seed_local_user.py

      - name: The seeded key authenticates against the containerised gateway
        run: |
          KEY=$(cat data/local/api_key)
          code=$(curl -s -o /tmp/models.json -w '%{http_code}' \
            -H "Authorization: Bearer $KEY" http://127.0.0.1:8080/v1/models)
          test "$code" = "200" || { echo "expected 200, got $code" >&2; cat /tmp/models.json >&2; exit 1; }
          grep -q '"data"' /tmp/models.json

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 || true

      - name: Tear down
        if: always()
        run: docker compose down -v || true
