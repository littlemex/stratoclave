name: e2e-nightly

# Playwright smoke that runs on a schedule and on manual dispatch.
#
# Kept separate from the normal `test` workflow because:
#   - It needs Chromium downloads (~120MB) and can take minutes, which
#     is too heavy for every PR.
#   - It depends on stable UI text and screenshots that sometimes drift
#     with design changes, so flake risk is higher.
#
# The initial version only runs the `smoke.spec.ts` baseline to confirm
# that the Vite dev server boots and the login screen renders. Future
# iterations will add admin flows, MSW-backed backend stubs, and visual
# regression against docs/screenshots/images/.
#
# The `compose` job below covers the other slow thing: the local-mode
# container path from docker-compose.yml. The fast wiring checks for local
# mode (scripts, auth, registry, error guidance) run on every PR in
# .github/workflows/test.yml; what only this file can afford is actually
# building the backend image and starting the compose stack.

on:
  schedule:
    - cron: "23 17 * * *"  # 17:23 UTC nightly
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "frontend/e2e/**"
      - "docker-compose.yml"
      - "Makefile"
      - "scripts/local/**"
      - "backend/Dockerfile"
      - ".github/workflows/e2e-nightly.yml"

permissions:
  contents: read

concurrency:
  group: e2e-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: playwright / smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Seed runtime config.json for the dev server
        # The Vite dev server fetches `/config.json` at bootstrap. The real
        # file is generated from SSM in production deploys; for the smoke
        # we use the committed dev example so the app can render the
        # sign-in page without touching a real Cognito backend.
        run: cp public/config.json.dev.example public/config.json
      - name: Install Playwright browsers (chromium only)
        run: npx playwright install --with-deps chromium
      - name: Run Playwright smoke
        run: npx playwright test --project=chromium

  compose:
    name: compose / local-mode container path
    runs-on: ubuntu-latest
    # Builds the backend image and brings the local stack up for real. No AWS
    # credentials are supplied, so every check below stops before Bedrock is
    # invoked; `make demo` cannot run here and is deliberately not attempted.
    env:
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install the backend runtime dependencies on the host
        # `make up` runs scripts/local/*.py on the HOST — they import the
        # backend's repositories — so the host needs these, not just boto3.
        # CI found this the hard way; docs/LOCAL.md now says so too.
        run: pip install -r backend/requirements.txt

      - name: The compose file is valid and its images are pinned
        run: |
          docker compose config >/tmp/compose-resolved.yml
          # A floating tag would silently change what the local path runs.
          if grep -E '^\s+image: .*:latest\s*$' /tmp/compose-resolved.yml; then
            echo "an image is pinned to :latest" >&2; exit 1
          fi

      - name: Provide a placeholder ~/.aws so the read-only mount resolves
        # compose mounts ${HOME}/.aws read-only and the gateway resolves
        # credentials from it. Real ones are deliberately absent, but the
        # container still needs *some* key: its DynamoDB Local calls are signed,
        # and DynamoDB Local rejects any access key id that is not alphanumeric,
        # since it names its database file after it.
        # AWS's documentation example pair cannot authenticate against AWS, so
        # Bedrock stays unreachable while the ledger path works. Writing a real
        # `[default]` profile also means the mount itself is exercised, rather
        # than CI passing credentials the documented path does not use.
        #
        # The profile must be `[default]`, and this job must NOT set AWS_PROFILE:
        # compose resolves `${AWS_PROFILE:-default}`, and `mvp/_bedrock_clients.py`
        # builds a `boto3.session.Session()` at import, so a profile name with no
        # matching section kills the container at startup with `ProfileNotFound`
        # before uvicorn ever binds.
        run: |
          mkdir -p "$HOME/.aws"
          printf '[default]\nregion = us-east-1\n' > "$HOME/.aws/config"
          printf '[default]\naws_access_key_id = %s\naws_secret_access_key = %s\n' \
            'AKIAIOSFODNN7EXAMPLE' 'wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY' > "$HOME/.aws/credentials"

      # `make up` rather than a paraphrase of it. The order matters and is easy
      # to get wrong: the gateway seeds the Permissions table from
      # `backend/permissions.json` at startup (main.py:126) and only *warns* if
      # the write fails, so a gateway started before the tables exist serves
      # every authenticated request as 403 with nothing in its log to say why.
      # `make up` starts the store, creates the tables, and only then builds and
      # starts the gateway. Running the documented command is also the only way
      # this job cannot drift from what a reader is told to type.
      - name: make up (store, tables, gateway, seeded key)
        run: make up

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=300

      - name: The seeded key authenticates against the containerised gateway
        run: |
          KEY=$(cat data/local/api_key)
          code=$(curl -s -o /tmp/models.json -w '%{http_code}' \
            -H "Authorization: Bearer $KEY" http://127.0.0.1:8080/v1/models)
          test "$code" = "200" || { echo "expected 200, got $code" >&2; cat /tmp/models.json >&2; exit 1; }
          grep -q '"data"' /tmp/models.json

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 || true

      - name: Tear down
        if: always()
        run: docker compose down -v || true
