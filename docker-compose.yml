# Local mode: DynamoDB is local, Bedrock is real.
#
# The only thing this file runs on your machine is the state store
# (DynamoDB Local) and the gateway process itself. Every inference call the
# gateway makes still goes to your own Amazon Bedrock account, using
# credentials read (read-only) from your host's ~/.aws — nothing here can
# invoke a model without them, and nothing here bakes credentials into an
# image layer. See docs/LOCAL.md for what this setup can and cannot verify.
#
# `make up` drives this file end to end (tables, seed user, health checks).
# Works with `docker compose` or `finch compose` — the compose schema is the
# same either way; only the CLI binary differs.
name: stratoclave-local

services:
  dynamodb-local:
    # A-02-docker (see backend/Dockerfile): tag-only references are mutable.
    # Pinned to a specific version rather than `latest`; bump deliberately.
    image: amazon/dynamodb-local:2.5.2
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    working_dir: /home/dynamodblocal
    # The image runs as uid 1000, but a fresh named volume is created owned by
    # root with mode 0700 on some runtimes (nerdctl, which is what `finch
    # compose` drives), so DynamoDB Local cannot open its sqlite file. It still
    # answers HTTP, so the container looks healthy while every operation fails
    # with `unable to open database file` and the store retries forever. Running
    # as root inside this container is the portable fix; it holds nothing but
    # local test state and is reachable on loopback only.
    user: root
    ports:
      # Loopback only — this table store has no auth of its own.
      - "127.0.0.1:8000:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    restart: unless-stopped

  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - dynamodb-local
    ports:
      # Loopback only. The deployed path binds behind CloudFront/ALB with a
      # WAF and CDN-origin header check in front of it; a laptop has none of
      # that, so this must never be reachable from outside the machine.
      - "127.0.0.1:8080:8000"
    environment:
      # Skips the Cognito/OIDC/CORS hard-requirements that only apply when
      # ENVIRONMENT=production (backend/main.py) — this mode never touches
      # Cognito, it authenticates with the sk-stratoclave-* API key seeded
      # below.
      ENVIRONMENT: development
      # Off by default (backend/mvp/openai_responses.py) — route exposure must
      # be opted into. Local mode turns it on explicitly so all three routes
      # in `make demo` actually work, rather than the OpenAI Responses route
      # silently 503ing.
      STRATOCLAVE_CODEX_ENABLED: "true"
      # Off by default, which is the shipped posture: a tenant with a dollar pool
      # sits in `shadow` — the sound reservation bound is computed and recorded,
      # admission still uses the legacy estimate, and nothing is refused. Set this
      # to 1 to see `enforced`, where the bound is what admission reserves and
      # unboundable content is refused. `scripts/local/prove_ceiling.py` needs it
      # on; `make demo` does not care either way.
      STRATOCLAVE_HARD_CEILING_GATE: ${STRATOCLAVE_HARD_CEILING_GATE:-}
      # Off by default (the shipped posture): a registry entry can only ever
      # declare served_by="vllm" if this is "true" AND its endpoint_key is in
      # the allowlist below — see backend/mvp/serving/vllm.py and
      # docs/LOCAL_MODELS.md. Empty/unset means the flag reads false.
      HYBRID_SERVING_ENABLED: ${HYBRID_SERVING_ENABLED:-}
      # Operator allowlist, {"<endpoint_key>": "<url>"} — the SSRF guard that
      # keeps a vLLM entry from ever inventing a URL. Empty means no
      # self-hosted endpoint is servable even with the flag on.
      STRATOCLAVE_VLLM_ENDPOINTS: ${STRATOCLAVE_VLLM_ENDPOINTS:-}
      # Points at an alternate registry document (adds a served_by="vllm"
      # entry on top of the shipped catalog) — unset uses the shipped
      # backend/mvp/defaults/models.json untouched. See docs/LOCAL_MODELS.md.
      STRATOCLAVE_MODEL_REGISTRY_PATH: ${STRATOCLAVE_MODEL_REGISTRY_PATH:-}
      # Operator-declared cost-recovery rate document for self-hosted
      # endpoints (backend/mvp/pricing_feeds/selfhosted.py). Unset means a
      # servable vLLM entry has no published rate and falls back to the
      # bundled floor.
      STRATOCLAVE_SELFHOSTED_RATES_PATH: ${STRATOCLAVE_SELFHOSTED_RATES_PATH:-}
      # Empty means the built-in bundled floor (defaults/pricing.json) is
      # charged, including for a vLLM entry's own "vllm" pricing_key — the
      # self-hosted rate document above only takes effect once this names the
      # live feed pipeline ("bedrock-live"), same as a real deployment. See
      # docs/LOCAL_MODELS.md and docs/design/price-feeds.md Sec.4.
      STRATOCLAVE_PRICE_SOURCE: ${STRATOCLAVE_PRICE_SOURCE:-}
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb-local:8000
      # Deliberately NOT overriding a Bedrock endpoint: inference stays real.
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_PROFILE: ${AWS_PROFILE:-default}
      # Passed through only when set in the shell (a key with no value is unset in
      # the container otherwise). STRATOCLAVE_INFERENCE_REGIONS keeps inference
      # inside a set of regions (docs/DEPLOYMENT.md); a set-but-empty value is
      # refused at startup, which is why it is not `${...:-}` like the others.
      STRATOCLAVE_INFERENCE_REGIONS:
      DEFAULT_BEDROCK_MODEL:
      # boto3 resolves SSO token cache relative to $HOME/.aws/sso/cache, so
      # HOME must point at the mounted .aws directory too, not just these two
      # file paths.
      HOME: /app
      AWS_CONFIG_FILE: /app/.aws/config
      AWS_SHARED_CREDENTIALS_FILE: /app/.aws/credentials
      # Empty by default — only needed when AWS_PROFILE resolves through a
      # credential_process binary (an internal SSO wrapper, Isengard, etc.)
      # that exists on your host but not inside this image. Export static
      # credentials first (`aws configure export-credentials --profile
      # <name> --format env`) and set these three, and the gateway uses them
      # directly instead of invoking the missing binary. See docs/LOCAL_MODELS.md.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      DEFAULT_ORG_ID: default-org
    volumes:
      # Read-only: this container can use your credentials, never edit them.
      - ${HOME}/.aws:/app/.aws:ro
      # Read-only: lets STRATOCLAVE_MODEL_REGISTRY_PATH / _SELFHOSTED_RATES_PATH
      # above point at a document under scripts/local/ (outside the backend/
      # build context) without baking it into the image. Mounted unconditionally;
      # harmless when the two env vars above are unset. See docs/LOCAL_MODELS.md.
      - ./scripts/local:/app/local-dev:ro
    restart: unless-stopped

volumes:
  dynamodb-data:
